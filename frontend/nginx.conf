server {
    listen 80;
    server_name localhost zeromall.local seller.zeromall.local admin.zeromall.local *.zeromall.local;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Không cache index.html để đảm bảo trình duyệt luôn nhận mã mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Tài nguyên tĩnh đã có hash (index-CJY6VgKC.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
