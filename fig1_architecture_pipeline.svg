<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 780" width="850" height="780" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Seller Input Box -->
  <g transform="translate(250, 25)" filter="url(#shadow)">
    <rect width="350" height="55" rx="8" fill="#1e293b" />
    <text x="175" y="27" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Seller Product Onboarding</text>
    <text x="175" y="44" fill="#94a3b8" font-size="11" text-anchor="middle">Uploads Album (1-9 Images), Title, Category, Price</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 425 80 L 425 115" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="435" y="102" fill="#64748b" font-size="10" font-weight="600">Base64 Images / Raw Strings</text>

  <!-- 2. Frontend Web Client -->
  <g transform="translate(250, 120)" filter="url(#shadow)">
    <rect width="350" height="60" rx="8" fill="#0f766e" />
    <text x="175" y="27" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Frontend Web Client (React / TypeScript)</text>
    <text x="175" y="46" fill="#ccfbf1" font-size="11" text-anchor="middle">400ms Keystroke Debounce | Local Base64 Resolution | Real-time Audit Trigger</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 425 180 L 425 215" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="435" y="202" fill="#64748b" font-size="10" font-weight="600">POST /products/ai/audit-category</text>

  <!-- 3. Backend Product Service -->
  <g transform="translate(225, 220)" filter="url(#shadow)">
    <rect width="400" height="65" rx="8" fill="#0369a1" />
    <text x="200" y="28" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Backend Product Service (NestJS - Port 3002)</text>
    <text x="200" y="47" fill="#e0f2fe" font-size="11" text-anchor="middle">Microservice Coordinator | Visual Perception Cache | Deterministic Business Rules</text>
  </g>

  <!-- Branching Arrows 3 -> T1 & T2 -->
  <path d="M 330 285 L 330 315 L 200 315 L 200 345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 520 285 L 520 315 L 650 315 L 650 345" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- 4. Tier 1: TextSanitizer Agent -->
  <g transform="translate(30, 350)" filter="url(#shadow)">
    <rect width="340" height="90" rx="8" fill="#f8fafc" stroke="#4338ca" stroke-width="2" />
    <rect width="340" height="26" rx="8" fill="#4338ca" />
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">T1: TextSanitizer Agent</text>
    <text x="170" y="44" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Adversarial Character Sanitization &amp; NLP Rules</text>
    <text x="170" y="62" fill="#475569" font-size="10.5" text-anchor="middle">• Strip zero-width &amp; hidden delimiters (​, ﻿)</text>
    <text x="170" y="78" fill="#475569" font-size="10.5" text-anchor="middle">• Leetspeak homoglyph translation &amp; 400+ banned words</text>
  </g>

  <!-- 5. Tier 2: MultiImageVisual Agent -->
  <g transform="translate(480, 350)" filter="url(#shadow)">
    <rect width="340" height="90" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="2" />
    <rect width="340" height="26" rx="8" fill="#0d9488" />
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">T2: MultiImageVisual Agent (PyTorch - Port 5005)</text>
    <text x="170" y="44" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">CLIP ViT-B-32 Zero-Shot &amp; Worst-Case Pooling</text>
    <text x="170" y="62" fill="#475569" font-size="10.5" text-anchor="middle">• 512-dim visual vector extraction for album (1-9 images)</text>
    <text x="170" y="78" fill="#475569" font-size="10.5" text-anchor="middle">• Pre-encoded memory: 18 categories &amp; 6 contraband prompts</text>
  </g>

  <!-- Convergence Arrows T1 & T2 -> T3 -->
  <path d="M 200 440 L 200 475 L 350 475 L 350 495" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 650 440 L 650 475 L 500 475 L 500 495" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- 6. Tier 3: Cross-Modal Evaluator -->
  <g transform="translate(180, 500)" filter="url(#shadow)">
    <rect width="490" height="85" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2" />
    <rect width="490" height="26" rx="8" fill="#d97706" />
    <text x="245" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">T3: Cross-Modal Evaluator (Arbitration &amp; Decision Logic)</text>
    <text x="245" y="45" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">Cosine Metric Verification: sim(v_img, v_title) &gt;= 0.45</text>
    <text x="245" y="62" fill="#475569" font-size="10.5" text-anchor="middle">Album Worst-Case Pooling: max S_prohibited(I_k) &gt;= 0.22</text>
    <text x="245" y="76" fill="#475569" font-size="10.5" text-anchor="middle">Domain Conflict Matrix: Tops vs. Bottoms, Apparel vs. Footwear/Electronics</text>
  </g>

  <!-- Output Decision Arrows -->
  <path d="M 320 585 L 320 620 L 210 620 L 210 635" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)" />
  <path d="M 530 585 L 530 620 L 640 620 L 640 635" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- 7. Decision A: Prohibited / Critical Violation -->
  <g transform="translate(40, 640)" filter="url(#shadow)">
    <rect width="340" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <rect width="340" height="26" rx="8" fill="#dc2626" />
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PROHIBITED ITEM / CRITICAL VIOLATION</text>
    <text x="170" y="44" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">[Proactive Safety Guard Triggered]</text>
    <text x="170" y="62" fill="#7f1d1d" font-size="10.5" text-anchor="middle">• Disables UI Submit Buttons (disabled = true)</text>
    <text x="170" y="78" fill="#7f1d1d" font-size="10.5" text-anchor="middle">• NestJS API rejects with HTTP 400 Bad Request</text>
    <text x="170" y="93" fill="#7f1d1d" font-size="10" text-anchor="middle">• Blocks database insertion &amp; records audit trail</text>
  </g>

  <!-- 8. Decision B: Valid / Minor Warning -->
  <g transform="translate(470, 640)" filter="url(#shadow)">
    <rect width="340" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect width="340" height="26" rx="8" fill="#16a34a" />
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">VALID LISTING / ACTIONABLE WARNING</text>
    <text x="170" y="44" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">[Compliant or Remediable State]</text>
    <text x="170" y="62" fill="#14532d" font-size="10.5" text-anchor="middle">• Permits product publishing &amp; active status</text>
    <text x="170" y="78" fill="#14532d" font-size="10.5" text-anchor="middle">• Auto-recommends correct canonical category</text>
    <text x="170" y="93" fill="#14532d" font-size="10" text-anchor="middle">• Synchronizes violation flags to Admin Studio</text>
  </g>
</svg>
